        text: |-
          本月目标（OKR）如下，大家对照一下自己负责的部分：

          | 目标 | 关键结果 | 负责人 |
          | --- | --- | --- |
          | 安全通过火焰山 | 借到芭蕉扇，全员无伤 | @**孙悟空** |
          | 降低伙食成本 | 化缘成功率提升到 80% | @**猪八戒** |
          | 经卷系统上线 | 检索响应时间 < 200 ms | @**太上老君** |
          | 顾问关系 | 每月一次顾问会 | @**沙悟净** |

          有问题这周五前提出来。
        reactions:
          "+1": [shawujing, taishanglaojun, nezha]
          sweat_smile: [zhubajie]
      - from: sunwukong
        after: 30m
        text: |-
          化缘成功率 80% 是不是有点高？上个月才 52%。
      - from: tangseng
        after: 20m
        text: |-
          目标要有挑战性。八戒说他有信心。
        reactions:
          joy: [sunwukong, shawujing, nezha, erlangshen]
