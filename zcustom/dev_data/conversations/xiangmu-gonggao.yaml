channel: 项目公告
topics:
  - topic: 团队约定
    start: {days_ago: 20, time: "09:00"}
    messages:
      - from: tangseng
        text: |-
          各位，取经项目正式进入长途阶段，几条约定请大家看一下：

          1. **讨论放到对应频道**：路线问 #**取经路线**，线上问题去 #**降妖除魔**，吃饭去 #**茶水间**。
          2. **一个话题只聊一件事**，话题名写清楚，比如「女儿国通关手续」，不要写「问一下」。
          3. 遇到妖怪先报备，**不要单独行动**。说的就是你 @**孙悟空**。
          4. 每周一早上在 #**师徒小会** 过一遍上周进度。

          有意见在 #**茶水间** 里提，我都会看。
        reactions:
          "+1": [sunwukong, shawujing, zhubajie, bailongma, nezha]
          pray: [huianxingzhe]
      - from: sunwukong
        after: 12m
        text: |-
          收到。补充一条运维约定：生产环境的金箍棒（我是说管理员权限）**只在值班时用**，用完在 #**降妖除魔** 留个记录。
        reactions:
          muscle: [erlangshen, nezha]
      - from: tangseng
        after: 1h
        text: |-
          好。另外，沙师弟已经整理了[新人入门文档](https://example.com/onboarding)，新同事先看这个。
