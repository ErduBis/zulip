  - topic: 金角银角的葫芦漏洞
    start: {hours_ago: 6}
    messages:
      - from: nezha
        text: |-
          报一个奇怪的漏洞：平顶山那边的系统，只要你**回应自己的名字**，就会被收进一个葫芦里。
      - from: ravi
        after: 3m
        text: |-
          Wait, what? 回答名字就被……收进去？这是什么 authentication？
      - from: sunwukong
        after: 5m
        text: |-
          这个我熟。它的逻辑大概是这样：

          ```python
          def call_name(name: str, reply: str | None) -> bool:
              # 只要对方应答，就把对方收进葫芦
              if reply is not None:
                  gourd.capture(name)
                  return True
              return False
          ```

          问题在于它**没有校验应答的人是不是本人**，换个名字也照样收。
      - from: taishanglaojun
        after: 15m
        text: |-
          那个葫芦是我实验室丢的，说来惭愧。我负责修。
        reactions:
          sweat_smile: [nezha, ravi]
      - from: erlangshen
        after: 10m
        text: |-
          临时措施：全员**听到有人喊名字先别答应**，在这里确认一下再说。
      - from: zhubajie
        after: 2m
        text: |-
          那要是师父喊我吃饭呢？
      - from: sunwukong
        after: 1m
        text: |-
          师父喊你吃饭会走 #**茶水间**，不会在山里喊。
        reactions:
          joy: [nezha, erlangshen, ravi, shawujing]
      - from: taishanglaojun
        after: 40m
        text: |-
          修复已经提交，加了身份校验。麻烦 @**哪吒** 帮忙验证一下？
      - from: nezha
        after: 30m
        text: |-
          验证通过 :green_tick: 我喊了三次「孙行者」，葫芦都没反应。
        reactions:
          tada: [taishanglaojun, sunwukong]
