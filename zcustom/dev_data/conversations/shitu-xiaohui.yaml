# 格式说明见 ../README.md。

channel: 师徒小会
topics:
  - topic: 要不要回高老庄
    start: {days_ago: 12, time: "20:30"}
    messages:
      - from: zhubajie
        text: |-
          说个心里话，最近有点累。高老庄那边问我要不要回去，待遇还行，离家也近。
      - from: shawujing
        after: 5m
        text: |-
          二师兄，这事你想清楚了吗？
      - from: zhubajie
        after: 3m
        text: |-
          没想清楚，所以才说出来。每天走几十里路，饭还经常吃不饱 :sob:
      - from: sunwukong
        after: 2m
        text: |-
          你这个月第三次说要回高老庄了。
        reactions:
          joy: [shawujing, bailongma]
      - from: tangseng
        after: 10m
        text: |-
          八戒，累了可以说，这很正常。我们看看能做什么：
          - 伙食预算我去申请增加
          - 下周安排两天休整
          - 化缘的活大家轮流来，不全压在你身上

          你考虑一下，**真想走我也不拦**，但我希望你留下。
        reactions:
          heart: [zhubajie, shawujing, bailongma]
      - from: zhubajie
        after: 15m
        text: |-
          师父这么说，那我再坚持坚持。伙食预算的事别忘了啊。
        reactions:
          tada: [shawujing, sunwukong]
      - from: bailongma
        after: 2m
        text: |-
          我也觉得最近节奏太紧。休整两天挺好的。
      - from: shawujing
        after: 5m
        text: |-
          我来排一下休整的日子，明天发到这里。
