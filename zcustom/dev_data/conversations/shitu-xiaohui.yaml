  - topic: 绩效和奖金
    start: {hours_ago: 20}
    messages:
      - from: tangseng
        text: |-
          这一季度的绩效评估要开始了。今年试点一个新算法，先给大家看一下：

          $$
          \text{奖金} = \text{基数} \times \left(0.6 \cdot \text{目标完成度} + 0.4 \cdot \text{同事评价}\right)
          $$

          同事评价是匿名的，周五前填完。
      - from: sunwukong
        after: 10m
        text: |-
          降妖的数量算在目标完成度里吗？
      - from: tangseng
        after: 5m
        text: |-
          算。但**打死的和劝降的权重一样**，鼓励大家先讲道理。
        reactions:
          thinking: [sunwukong]
      - from: zhubajie
        after: 3m
        text: |-
          化缘成功的次数也算吧？
      - from: tangseng
        after: 2m
        text: |-
          算，按 #**取经路线>化缘路线优化** 里的统计口径。
      - from: shawujing
        after: 20m
        text: |-
          我把评价表做好了，链接已经私信发给各位。
        reactions:
          "+1": [tangseng, bailongma]
