  - topic: 盘丝洞绕行
    start: {days_ago: 1, time: "19:00"}
    messages:
      - from: bailongma
        text: |-
          明天的路线经过盘丝洞附近。当地人说那里经常有人被缠住，建议绕行。
      - from: shawujing
        after: 10m
        text: |-
          绕行要多走多远？
      - from: bailongma
        after: 5m
        text: |-
          多走 18 里，大约多花一个半小时。
      - from: sunwukong
        after: 3m
        text: |-
          我同意绕行。那边的事我以前处理过，**丝太多，不好清理**。
      - from: zhubajie
        after: 2m
        text: |-
          我听说那附近有温泉……
      - from: sunwukong
        after: 1m
        text: |-
          就是因为有温泉才要绕。
        reactions:
          joy: [shawujing, bailongma, nezha]
      - from: tangseng
        after: 15m
        text: |-
          绕行。安全第一。白龙马把新路线发到 #**取经路线>每日行程**。
        reactions:
          horse: [bailongma]
