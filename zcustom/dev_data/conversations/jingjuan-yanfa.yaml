  - topic: 经卷检索性能优化
    start: {days_ago: 3, time: "14:00"}
    messages:
      - from: taishanglaojun
        text: |-
          经卷检索现在平均响应 850 ms，目标是 200 ms 以内。大家有什么想法？
      - from: ravi
        after: 10m
        text: |-
          现在是全文扫描吗？If so, an inverted index would help a lot.
      - from: taishanglaojun
        after: 5m
        text: |-
          是的，三藏真经一共 5048 卷，每次都从头翻。
      - from: sunwukong
        after: 3m
        text: |-
          那肯定慢。我写了个倒排索引的原型：

          ```python
          from collections import defaultdict

          def build_index(scrolls: dict[int, str]) -> dict[str, set[int]]:
              index: dict[str, set[int]] = defaultdict(set)
              for scroll_id, text in scrolls.items():
                  for word in tokenize(text):
                      index[word].add(scroll_id)
              return index
          ```
        reactions:
          "+1": [ravi, taishanglaojun]
      - from: ravi
        after: 15m
        text: |-
          Nice. 中文分词怎么做？`tokenize` 用的是什么？
      - from: sunwukong
        after: 5m
        text: |-
          先用最简单的二元切分，以后再换词典。
      - from: taishanglaojun
        after: 30m
        text: |-
          算了一下索引大小，假设每卷平均 $$n$$ 个不同的词，总共 $$N = 5048$$ 卷，索引条目数大约是 $$N \cdot n$$。按 $$n \approx 2000$$ 估计，一千万条左右，内存放得下。
      - from: nezha
        after: 1h
        text: |-
          前端这边加了一个搜索框，输入的时候实时提示。截图：

          [检索界面](/static/images/characters/fisher.png)
      - from: change
        after: 2h
        text: |-
          搜索框的样式我看了一下，有两点建议：
          - 输入框圆角改成 4px，和其他输入框一致
          - 结果为空时显示「没有找到相关经卷」，不要显示空白
        reactions:
          "+1": [nezha]
      - from: taishanglaojun
        after: 2h
        text: |-
          测了一下，平均响应 **140 ms**，达标了。下周上线。
        reactions:
          tada: [sunwukong, ravi, nezha, change, tangseng]
      - from: tangseng
        after: 20m
        text: |-
          好！这是这个月最好的消息 :pray:
