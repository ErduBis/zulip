          西行之路，从长安出发，经过高昌、焉耆、龟兹、姑墨、疏勒，翻过葱岭，进入天竺。路上有沙漠，有雪山，有大河，也有热闹的城邦和集市。每到一地，我们都要办理通关文牒，拜访当地的官员，打听前方的路况，补充斋饭和饮水。

