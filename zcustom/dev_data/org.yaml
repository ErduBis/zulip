custom_profile_fields:
  - name: 职务
    type: short_text
    hint: 您在团队里负责什么？
  - name: 个人简介
    type: paragraph
    hint: 简单介绍一下自己，支持 Markdown
  - name: 常用兵器
    type: dropdown
    hint: 您最顺手的家伙
    options:
      [九环锡杖, 金箍棒, 九齿钉耙, 降妖宝杖, 火尖枪, 三尖两刃刀, 笔记本电脑]
  - name: 入职日期
    type: date
  - name: 个人主页
    type: url
    hint: 您的博客或作品集地址
  - name: 导师
    type: user
    hint: 带您入门的同事
  - name: GitHub
    type: external_account
  - name: 称谓
    type: pronouns
    hint: 其他人应该怎样称呼您？

channel_folders:
  - name: 取经事务
    description: 西行路上的正事：路线、公告和核心决策
  - name: 技术与运维
    description: 研发、上线和处理线上妖怪
  - name: 生活与闲聊
    description: 吃饭、摸鱼和沿途见闻

channels:
  - name: 项目公告
    description: |-
      团队通知和重要决定，**仅管理员可以发言**。讨论请移步 #**茶水间** 或相关频道。
    folder: 取经事务
    creator: tangseng
    admins_only_post: true
    default_channel: true
    subscribers: everyone
  - name: 取经路线
    description: 路线规划、通关文牒和每日行程
    folder: 取经事务
    creator: tangseng
    subscribers: members
  - name: 师徒小会
    description: 核心团队的内部讨论，私有频道
    folder: 取经事务
    creator: tangseng
    private: true
    subscribers: [tangseng, sunwukong, zhubajie, shawujing, bailongma]
  - name: 菩萨顾问团
    description: |-
      和外部顾问的沟通频道，访客也在这里。请注意不要贴内部数据。
    folder: 取经事务
    creator: shawujing
    subscribers:
      [tangseng, sunwukong, shawujing, zhubajie, guanyin, huianxingzhe]
  - name: 降妖除魔
    description: |-
      线上事故和「妖怪」处理。事故编号写成 `妖#123` 会自动变成链接。
    folder: 技术与运维
    creator: sunwukong
    subscribers:
      [
        tangseng,
        sunwukong,
        shawujing,
        zhubajie,
        nezha,
        taishanglaojun,
        erlangshen,
        ravi,
      ]
  - name: 经卷研发
    description: 经卷系统的开发、代码评审、设计稿和发布
    folder: 技术与运维
    creator: taishanglaojun
    subscribers:
      [
        tangseng,
        sunwukong,
        shawujing,
        zhubajie,
        nezha,
        taishanglaojun,
        erlangshen,
        change,
        ravi,
      ]
  - name: 茶水间
    description: 吃饭、摸鱼、闲聊，什么都可以聊
    folder: 生活与闲聊
    creator: zhubajie
    default_channel: true
    subscribers: everyone
  - name: 西行见闻
    description: |-
      沿途的风景和故事，**网络公开**，没有账号的人也能看到。
    folder: 生活与闲聊
    creator: shawujing
    web_public: true
    subscribers:
      [
        tangseng,
        sunwukong,
        shawujing,
        zhubajie,
        nezha,
        change,
        ravi,
        huianxingzhe,
      ]

user_groups:
  - name: 取经团队
    description: 师徒四人加白龙马
    members: [tangseng, sunwukong, zhubajie, shawujing, bailongma]
  - name: 运维值班
    description: 线上出事时第一时间响应的同事
    members: [sunwukong, erlangshen, nezha]
  - name: 技术部
    description: 所有参与研发的同事
    members: [taishanglaojun, change, ravi]
    subgroups: [运维值班]

drafts:
