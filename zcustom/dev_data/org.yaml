      师父，紧箍咒的权限能不能改成需要二次确认？我是说
  - owner: sunwukong
    text: |-
      明天早会要提：
      - 火焰山方案的预算
      - 值班表
  - owner: zhubajie
    to: {channel: 茶水间, topic: 今天吃什么}
    text: |-
      我提议今天中午吃

scheduled_messages:
  - from: sunwukong
    to: {channel: 项目公告, topic: 周年回顾}
    deliver_in_days: 30
    text: |-
      西行项目启动又满一个月了 :tada: 本月回顾会安排在周五下午，请大家提前把要说的写在 #**茶水间** 里。
  - from: sunwukong
    to: {direct: [sunwukong]}
    deliver_in_days: 7
    text: |-
      备忘：检查一下金箍棒的证书是不是快过期了。
  - from: tangseng
    to: {channel: 取经路线, topic: 每日行程}
    deliver_in_days: 1
    text: |-
      明天早上 7 点出发，请大家带好通关文牒。

alert_words:
  [妖怪, 师父, 斋饭, 通关文牒, 芭蕉扇, 紧箍咒, 化缘, 上线, 宕机, 火焰山]

linkifiers:
  - pattern: "文牒#(?P<id>[0-9]+)"
    url_template: "https://example.com/wendie/{id}"
  - pattern: "妖#(?P<id>[0-9]+)"
    url_template: "https://example.com/yaoguai/{id}"

