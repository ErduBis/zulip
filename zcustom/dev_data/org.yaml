# 格式说明见同目录的 README.md。

realm:
  name: 取经项目组（示例）
  name_alternatives:
    - 西行事业部（示例）
    - 大唐取经有限公司（示例）
    - 灵山远征队（示例）
  description: |-
    西天取经项目的协作空间：路线规划、降妖除魔、经卷研发都在这里。

    **本组织只用于开发和演示**，人物和内容均为虚构，与任何真实组织无关。
  welcome_message_custom_text: |-
    欢迎加入取经项目组！先去 #**茶水间** 打个招呼，再看看 #**项目公告** 里的团队约定。
    有问题随时找 @**沙悟净**，他最有耐心。

